name: Build and deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Check backend URL
        if: github.event_name != 'pull_request' && vars.CHAT_API_URL != ''
        env:
          CHAT_API_URL: ${{ vars.CHAT_API_URL }}
        run: |
          if [[ "$CHAT_API_URL" != https://* ]]; then
            echo "::error::Set CHAT_API_URL to the HTTPS URL of your backend in repository variables."
            exit 1
          fi
      - run: npm run build
        env:
          CHAT_API_URL: ${{ vars.CHAT_API_URL || 'http://localhost:3000/' }}
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
